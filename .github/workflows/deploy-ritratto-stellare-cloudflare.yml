name: Deploy Ritratto Stellare API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ritratto-stellare/cloudflare/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Security Gate
        run: node security/security-gate.mjs

      - name: Install Wrangler
        working-directory: ritratto-stellare/cloudflare
        run: npm install --no-save wrangler

      - name: Guard required secrets
        working-directory: ritratto-stellare/cloudflare
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: ritratto-stellare/cloudflare
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
