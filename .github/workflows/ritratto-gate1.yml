name: Ritratto Gate 1 QA
on:
  push:
    branches: [ritratto-collaudo]
    paths:
      - 'ritratto-public/js/**'
      - 'ritratto-public/qa/**'
      - '.github/workflows/ritratto-gate1.yml'
  workflow_dispatch:
jobs:
  gate1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install astronomy-engine@2.1.19 --no-save
      - run: node ritratto-public/qa/portrait-gate1.mjs
      - run: node ritratto-public/qa/personal-horoscope-gate.mjs
      - run: node ritratto-public/qa/gate1-full.mjs
