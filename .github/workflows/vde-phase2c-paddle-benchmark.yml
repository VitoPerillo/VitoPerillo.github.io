name: VDE Phase2C PaddleOCR Benchmark

on:
  push:
    branches:
      - vde-phase2c-ocr-benchmark-20261011
    paths:
      - .github/workflows/vde-phase2c-paddle-benchmark.yml
      - vde-phase2c/paddle_benchmark.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install "paddlepaddle==3.3.1" "paddleocr==3.7.0" "Pillow==12.3.0"
      - name: Run benchmark
        env:
          FLAGS_enable_pir_api: "0"
          FLAGS_use_mkldnn: "0"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
        run: |
          python vde-phase2c/paddle_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vde-phase2c-paddleocr-benchmark
          path: paddleocr-benchmark.json
          retention-days: 1
