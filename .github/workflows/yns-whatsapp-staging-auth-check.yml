name: YNS WhatsApp Staging Auth Check

on:
  push:
    branches: [yns-whatsapp-staging-auth]
    paths:
      - '.github/workflows/yns-whatsapp-staging-auth-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_URL: ${{ secrets.YSAD_STAGING_URL }}
      WP_USER: ${{ secrets.YSAD_STAGING_USER }}
      WP_APP_PASSWORD: ${{ secrets.YSAD_STAGING_APP_PASSWORD }}
    steps:
      - name: Verify secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STAGING_URL:-}"
          test -n "${WP_USER:-}"
          test -n "${WP_APP_PASSWORD:-}"
          case "$STAGING_URL" in
            *staging-gestionale*) ;;
            *) echo "Refusing non-staging target"; exit 41 ;;
          esac
          echo "YNS_STAGING_SECRETS_PRESENT=yes"

      - name: Verify authenticated Plugin Bridge read access
        shell: python
        run: |
          import os,base64,json,urllib.request
          base=os.environ['STAGING_URL'].rstrip('/')
          auth=base64.b64encode((os.environ['WP_USER']+':'+os.environ['WP_APP_PASSWORD']).encode()).decode()
          headers={'Authorization':'Basic '+auth,'User-Agent':'YNS-WhatsApp-Staging-Auth-Check/1.0','Cache-Control':'no-cache'}
          def get(path):
              req=urllib.request.Request(base+'/wp-json'+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,json.loads(r.read().decode())
          code,status=get('/ph-plugin-bridge/v1/status')
          code2,plugins=get('/ph-plugin-bridge/v1/plugins')
          print(json.dumps({
            'ok': code==200 and code2==200,
            'environment':'staging',
            'status_http':code,
            'plugins_http':code2,
            'bridge_ok':status.get('ok'),
            'bridge_version':status.get('version'),
            'plugin_count':len(plugins.get('plugins',plugins if isinstance(plugins,list) else []))
          },separators=(',',':')))
