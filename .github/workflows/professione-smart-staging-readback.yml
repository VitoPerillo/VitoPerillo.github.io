name: Professione Smart Staging Readback

on:
  push:
    branches: [professione-smart-staging]
    paths:
      - ".github/workflows/professione-smart-staging-readback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professione-smart-staging-readback
  cancel-in-progress: false

jobs:
  readback:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b72d4037bafea30b480d3545812ab253
      WORKER_NAME: professione-smart
    steps:
      - name: Guard Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Read current Worker source and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p readback
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          script_url="$base/workers/scripts/$WORKER_NAME/content"
          service_url="$base/workers/services/$WORKER_NAME/environments/production/content"
          settings_url="$base/workers/services/$WORKER_NAME/environments/production/settings"

          if curl --fail-with-body -sS -D readback/worker-headers.txt               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$script_url" -o readback/worker-content.bin; then
            echo "source_endpoint=scripts" > readback/readback-info.txt
          else
            rm -f readback/worker-content.bin readback/worker-headers.txt
            curl --fail-with-body -sS -D readback/worker-headers.txt               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$service_url" -o readback/worker-content.bin
            echo "source_endpoint=services-production" > readback/readback-info.txt
          fi

          curl --fail-with-body -sS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$settings_url" -o readback/settings.json || true

          printf "worker=%s\n" "$WORKER_NAME" >> readback/readback-info.txt
          printf "utc=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> readback/readback-info.txt
          sha256sum readback/worker-content.bin > readback/worker-content.sha256

      - name: Upload readback artifact
        uses: actions/upload-artifact@v4
        with:
          name: professione-smart-staging-readback
          path: readback/
          if-no-files-found: error
          retention-days: 1
