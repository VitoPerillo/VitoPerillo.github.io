name: Build YNS Direct Bridge

on:
  push:
    branches: [main]
    paths:
      - "ops/yns-direct/plugin/yns-direct-bridge/**"
      - ".github/workflows/build-yns-direct.yml"

permissions:
  contents: write

concurrency:
  group: build-yns-direct
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build plugin zip
        shell: bash
        run: |
          set -euo pipefail
          rm -f ops/yns-direct/dist/yns-direct-bridge.zip
          cd ops/yns-direct/plugin
          zip -qr ../dist/yns-direct-bridge.zip yns-direct-bridge
      - name: Commit rebuilt package
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ops/yns-direct/dist/yns-direct-bridge.zip; then
            echo "Package already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/yns-direct/dist/yns-direct-bridge.zip
          git commit -m "Rebuild YNS Direct Bridge package"
          git push
