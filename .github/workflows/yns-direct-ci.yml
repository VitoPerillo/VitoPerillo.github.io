name: YNS Direct CI

on:
  push:
    paths:
      - "ops/yns-direct/plugin/**"
      - "ops/yns-direct/dist/**"
      - ".github/workflows/yns-direct-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l ops/yns-direct/plugin/yns-direct-bridge/yns-direct-bridge.php
      - name: ZIP integrity
        run: |
          set -euo pipefail
          unzip -t ops/yns-direct/dist/yns-direct-bridge.zip
          rm -rf /tmp/yns-direct-test
          mkdir -p /tmp/yns-direct-test
          unzip -q ops/yns-direct/dist/yns-direct-bridge.zip -d /tmp/yns-direct-test
          test -f /tmp/yns-direct-test/yns-direct-bridge/yns-direct-bridge.php
          php -l /tmp/yns-direct-test/yns-direct-bridge/yns-direct-bridge.php
