name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run shared security gate
        run: node security/security-gate.mjs

      - name: Existing repository tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install --ignore-scripts --no-audit --no-fund
            npm test
            npm run check
          fi
