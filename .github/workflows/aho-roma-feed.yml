name: AHÓ ROMA Official Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build-roma-feed.mjs"
      - ".github/workflows/aho-roma-feed.yml"

permissions:
  contents: write

concurrency:
  group: aho-roma-official-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build official Roma feed
        run: node scripts/build-roma-feed.mjs

      - name: Commit feed only when changed
        shell: bash
        run: |
          if git diff --quiet -- public/feeds/roma-capitale.json; then
            echo "Official feed unchanged."
            exit 0
          fi
          git config user.name "aho-roma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/feeds/roma-capitale.json
          git commit -m "AHÓ ROMA: refresh official Roma Capitale feed"
          git push
