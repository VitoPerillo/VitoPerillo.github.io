name: Ritratto Stellare Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritratto-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe YNS Direct on staging
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.yoganostress.it/staging-gestionale"
          for path in             "/wp-json/yns-direct/v1/health"             "/wp-json/ph-plugin-bridge/v1/status"; do
            echo "=== GET $path ==="
            code=$(curl -sS -o /tmp/b -w "%{http_code}" "$BASE$path" || true)
            echo "HTTP $code"
            head -c 1500 /tmp/b || true
            echo
          done
