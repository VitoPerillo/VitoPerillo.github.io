name: Ritratto Stellare Deploy

on:
  push:
    branches: [main]
    paths:
      - "ritratto-worker/**"
      - "ritratto-public/**"
      - "wrangler.ritratto.jsonc"
      - ".github/workflows/ritratto-stellare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritratto-stellare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: node --check ritratto-worker/index.js && node --check ritratto-public/bridge.js

      - name: Require Cloudflare token
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Deploy Ritratto Stellare
        run: npx wrangler deploy --config wrangler.ritratto.jsonc
