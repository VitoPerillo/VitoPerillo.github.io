name: Local Autopilot CI Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-autopilot-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Security Gate
        run: node security/security-gate.mjs

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run check

      - name: Test
        run: npm test

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          CF_TOKEN_CLEAN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\\r\\n')"
          if [[ ! "$CF_TOKEN_CLEAN" =~ ^cfut_[A-Za-z0-9_-]+$ ]]; then
            CF_TOKEN_CLEAN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -n 's/.*\\(cfut_[A-Za-z0-9_-]*\\).*/\\1/p')"
          fi
          test -n "$CF_TOKEN_CLEAN"
          echo "::add-mask::$CF_TOKEN_CLEAN"
          CLOUDFLARE_API_TOKEN="$CF_TOKEN_CLEAN" npx wrangler deploy

      - name: Explain skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CI PASS. Deploy skipped because CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
