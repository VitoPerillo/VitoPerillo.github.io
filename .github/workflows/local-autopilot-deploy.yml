name: Local Autopilot CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-autopilot-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Security Gate
        run: node security/security-gate.mjs

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run check

      - name: Test
        run: npm test

      - name: Deployment ownership
        run: echo "Cloudflare Git integration deploys main; no API token is used by this workflow."
