name: Ritratto Astro QA
on:
  push:
    branches: [ritratto-collaudo]
    paths:
      - "ritratto-public/js/rs-astro-engine.js"
      - "ritratto-public/qa/astro-ai.mjs"
      - ".github/workflows/ritratto-astro-qa.yml"
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install --no-save astronomy-engine@2.1.19
      - run: node ritratto-public/qa/astro-ai.mjs\n      - name: Freeze hashes\n        run: sha256sum ritratto-public/js/rs-astro-engine.js ritratto-public/qa/astro-ai.mjs ritratto-public/qa/independent-reference-audit.json
