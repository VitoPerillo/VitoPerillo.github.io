name: Professione Smart - MR Bridge / Cloudflare Preview

on:
  push:
    branches:
      - professione-smart-staging
    paths:
      - "professione-smart-worker/**"
      - ".github/workflows/professione-smart-cloudflare-preview.yml"
  workflow_dispatch:
    inputs:
      create_preview:
        description: "Avvia una Cloudflare Preview dopo il gate MR Bridge"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mr-bridge-gate:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: b72d4037bafea30b480d3545812ab253
      CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_PROVIDER_ACCOUNT_ID: "317205417"
      GH_PROVIDER_ACCOUNT_NAME: VitoPerillo
      GH_REPO_ID: "1368437653"
      GH_REPO_NAME: VitoPerillo.github.io
      WORKER_NAME: professione-smart
      ROOT_DIRECTORY: /professione-smart-worker
    steps:
      - name: Checkout canonical staging source
        uses: actions/checkout@v4

      - name: MR Bridge preflight
        working-directory: professione-smart-worker
        run: node scripts/mr-bridge-preflight.mjs

      - name: Source syntax gate
        working-directory: professione-smart-worker
        run: npm run check

      - name: Configure native Cloudflare Preview build
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_preview == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview]')) }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          cf_call() {
            local label="$1"
            local method="$2"
            local url="$3"
            local data="${4:-}"
            local tmp
            tmp="$(mktemp)"
            local code
            if [ -n "$data" ]; then
              code="$(curl -sS -o "$tmp" -w "%{http_code}" "${auth[@]}" -X "$method" --data "$data" "$url")"
            else
              code="$(curl -sS -o "$tmp" -w "%{http_code}" "${auth[@]}" -X "$method" "$url")"
            fi
            echo "$label HTTP $code" >&2
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              jq -c '{success,errors,messages}' "$tmp" >&2 || true
              rm -f "$tmp"
              return 1
            fi
            cat "$tmp"
            rm -f "$tmp"
          }

          scripts="$(cf_call WORKERS_SCRIPTS GET "$api/workers/scripts")"
          worker_tag="$(jq -r --arg n "$WORKER_NAME" '.result[] | select(.id==$n) | .tag' <<<"$scripts" | head -n1)"
          if [ -z "$worker_tag" ] || [ "$worker_tag" = "null" ]; then
            echo "Worker tag not found for $WORKER_NAME" >&2
            exit 3
          fi

          tokens="$(cf_call BUILDS_TOKENS GET "$api/builds/tokens")"
          build_token_uuid="$(jq -r '.result[0].build_token_uuid // empty' <<<"$tokens")"
          if [ -z "$build_token_uuid" ]; then
            echo "No Cloudflare Workers Builds token available." >&2
            exit 4
          fi

          repo_payload="$(jq -nc \
            --arg provider_account_id "$GH_PROVIDER_ACCOUNT_ID" \
            --arg provider_account_name "$GH_PROVIDER_ACCOUNT_NAME" \
            --arg repo_id "$GH_REPO_ID" \
            --arg repo_name "$GH_REPO_NAME" \
            '{provider_type:"github",provider_account_id:$provider_account_id,provider_account_name:$provider_account_name,repo_id:$repo_id,repo_name:$repo_name}')"

          repo_resp="$(cf_call REPO_CONNECTION PUT "$api/builds/repos/connections" "$repo_payload")"
          repo_connection_uuid="$(jq -r '.result.repo_connection_uuid // .result.uuid // empty' <<<"$repo_resp")"
          if [ -z "$repo_connection_uuid" ]; then
            echo "Repository connection UUID missing." >&2
            exit 5
          fi

          triggers="$(cf_call LIST_TRIGGERS GET "$api/builds/workers/$worker_tag/triggers")"
          preview_uuid="$(jq -r '.result[] | select(.trigger_name=="Professione Smart Preview") | .trigger_uuid' <<<"$triggers" | head -n1)"

          payload="$(jq -nc \
            --arg worker_tag "$worker_tag" \
            --arg repo_connection_uuid "$repo_connection_uuid" \
            --arg build_token_uuid "$build_token_uuid" \
            --arg root "$ROOT_DIRECTORY" \
            '{
              external_script_id:$worker_tag,
              repo_connection_uuid:$repo_connection_uuid,
              build_token_uuid:$build_token_uuid,
              trigger_name:"Professione Smart Preview",
              build_command:"npm run check",
              deploy_command:"npx wrangler versions upload",
              root_directory:$root,
              branch_includes:["professione-smart-staging"],
              branch_excludes:[],
              path_includes:["professione-smart-worker/**"],
              path_excludes:[],
              build_caching_enabled:true
            }')"

          if [ -n "$preview_uuid" ]; then
            cf_call UPDATE_TRIGGER PATCH "$api/builds/triggers/$preview_uuid" "$payload" >/dev/null
            echo "Preview trigger updated."
          else
            created="$(cf_call CREATE_TRIGGER POST "$api/builds/triggers" "$payload")"
            preview_uuid="$(jq -r '.result.trigger_uuid // empty' <<<"$created")"
            if [ -z "$preview_uuid" ]; then
              echo "Preview trigger UUID missing after create." >&2
              exit 6
            fi
            echo "Preview trigger created."
          fi

          manual_payload="$(jq -nc --arg branch "professione-smart-staging" '{branch:$branch}')"
          build_resp="$(cf_call START_PREVIEW_BUILD POST "$api/builds/triggers/$preview_uuid/builds" "$manual_payload")"
          build_uuid="$(jq -r '.result.build_uuid // empty' <<<"$build_resp")"

          echo "MR_BRIDGE_PREVIEW_REQUESTED=true"
          echo "Worker: $WORKER_NAME"
          echo "Root directory: $ROOT_DIRECTORY"
          echo "Branch: professione-smart-staging"
          echo "Preview deploy command: npx wrangler versions upload"
          if [ -n "$build_uuid" ]; then
            echo "Build UUID: $build_uuid"
          fi
