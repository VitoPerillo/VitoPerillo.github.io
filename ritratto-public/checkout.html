<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento — Ritratto Stellare</title><style>body{margin:0;font-family:Inter,system-ui;background:#0d091b;color:#f7f1ff}.w{width:min(680px,92vw);margin:40px auto}.c{padding:32px;border:1px solid #392d58;border-radius:24px;background:#18122d}a{color:#f4dfa7}.k{color:#dfbf78;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}.sum{padding:18px;border:1px solid #392d58;border-radius:16px;margin:22px 0}.price{font-size:1.7rem;font-weight:900;color:#f4dfa7}.btn{display:block;text-align:center;padding:15px;border-radius:999px;background:#dfbf78;color:#24180a;font-weight:900;text-decoration:none}.muted{color:#bcb1cf}</style></head><body><main class="w"><a href="/">← RITRATTO STELLARE</a><section class="c"><div class="k">Riepilogo prima del pagamento</div><h1 id="h"></h1><p class="muted">I tuoi dati sono stati raccolti. Controlla la scelta e continua al pagamento.</p><div class="sum"><strong id="plan"></strong><div class="price" id="price"></div></div><a id="pay" class="btn" href="#">CONTINUA AL PAGAMENTO SICURO</a><p class="muted" style="font-size:.85rem;text-align:center">Ambiente di collaudo: nessun addebito reale viene eseguito da questa pagina.</p></section></main><script>const P={pegaso:{n:"PEGASO",monthly:"€6,90 / mese",annual:"PEGASO STAR · €69 / anno"},fenice:{n:"FENICE",monthly:"€9,90 / mese",annual:"FENICE STAR · €99 / anno"},andromeda:{n:"ANDROMEDA",monthly:"€14,90 / mese",annual:"ANDROMEDA STAR · €149 / anno"}};const q=new URLSearchParams(location.search),p=q.get("plan")||"fenice",c=q.get("cadence")==="annual"?"annual":"monthly",x=P[p]||P.fenice;h.textContent="Conferma "+x.n;plan.textContent=x.n;price.textContent=x[c];pay.onclick=e=>{e.preventDefault();const profile=JSON.parse(sessionStorage.getItem("rs_purchase_profile")||"{}");const api=(window.RS_PAYMENT_API||"").replace(/\/$/,"");if(!api){alert("Pagamento Mollie in staging: backend non ancora configurato.");return;}pay.textContent="PREPARO IL PAGAMENTO…";fetch(api+"/v1/mollie/checkout",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({plan:p,cadence:c,profile_id:profile.public_id||profile.email||"",name:profile.name||"",email:profile.email||""})}).then(async r=>{const j=await r.json();if(!r.ok||!j.checkout_url)throw new Error(j.error||"Pagamento non disponibile");location.href=j.checkout_url;}).catch(err=>{pay.textContent="CONTINUA AL PAGAMENTO SICURO";alert(err.message);});};</script></body></html>
