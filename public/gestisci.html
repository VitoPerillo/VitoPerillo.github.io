<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestisci contenuto</title><link rel="stylesheet" href="/app.css"></head><body><main><h1>Gestisci il tuo contenuto</h1><p>Puoi aggiornare il testo o chiedere la rimozione. Ogni modifica torna automaticamente nei controlli.</p><form id="f"><label>Titolo <input name="title"></label><label>Descrizione <textarea name="description"></textarea></label><button value="update">Invia modifica</button><button type="button" id="del">Rimuovi contenuto</button></form><p id="out"></p></main><script>const q=new URLSearchParams(location.search),id=Number(q.get('id')),token=q.get('token')||'';async function go(action,payload={}){const r=await fetch('/api/manage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,token,action,payload})});const j=await r.json();out.textContent=r.ok?'Richiesta ricevuta.':('Errore: '+(j.error||r.status));}f.onsubmit=e=>{e.preventDefault();go('update',Object.fromEntries(new FormData(f)))};del.onclick=()=>confirm('Confermi la rimozione?')&&go('delete');</script></body></html>
