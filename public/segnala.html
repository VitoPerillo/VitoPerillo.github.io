<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segnala — AHÓ ROMA</title><link rel="stylesheet" href="/app.css"></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="/"><span class="brand-mark">AHÓ</span><span><b>AHÓ ROMA</b><small>Che succede a Roma?</small></span></a><nav><a href="/quartieri">Quartieri</a><a href="/eventi">Eventi</a><a href="/attivita">Attività</a><a class="nav-cta" href="/">Home</a></nav></div></header><main><section class="area-hero"><div class="wrap"><span class="kicker">PARTECIPA</span><h1>Segnala qualcosa di utile.</h1><p>Un evento, un'attività locale o una segnalazione di quartiere. Nessun account: verifichiamo soltanto la tua email.</p></div></section><section class="section wrap"><form id="f" enctype="multipart/form-data"><label>Cosa vuoi inviare?<select name="submission_type" id="type"><option value="report">Segnalazione di quartiere</option><option value="event">Evento</option><option value="business">Attività locale</option></select></label><label>Quartiere<select name="area_id" id="area" required><option value="">Caricamento…</option></select></label><label>Categoria<select name="category_id" id="category" required><option value="">Caricamento…</option></select></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Titolo<input name="title" required maxlength="140" placeholder="Es. Chiusura temporanea in via…"></label><label>Descrizione<textarea name="description" required maxlength="4000" placeholder="Scrivi le informazioni essenziali: cosa, dove, quando e perché è utile saperlo."></textarea></label><div id="eventFields" hidden><label>Data e ora di inizio<input name="start" type="datetime-local"></label><label>Luogo<input name="venue"></label></div><div id="businessFields" hidden><label>Indirizzo<input name="address"></label><label>CAP<input name="cap"></label><label>Sito web facoltativo<input name="website" type="url"></label></div><label>Immagine facoltativa<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><input name="website_hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><input type="hidden" name="form_started_at" id="fst"><label style="display:flex;grid-template-columns:auto 1fr;align-items:start"><input type="checkbox" name="rights_declared" value="1" required> <span>Dichiaro di avere il diritto di inviare il contenuto e l'eventuale immagine.</span></label><button>Invia per la verifica</button></form><p id="out"></p></section></main><footer><div class="wrap">AHÓ ROMA · Roma Ovest / Sud-Ovest</div></footer><script>
const fst=document.getElementById('fst'),f=document.getElementById('f'),type=document.getElementById('type'),area=document.getElementById('area'),category=document.getElementById('category'),eventFields=document.getElementById('eventFields'),businessFields=document.getElementById('businessFields'),out=document.getElementById('out');fst.value=Date.now();let cats=[];
async function init(){const [ar,cr]=await Promise.all([fetch('/api/areas').then(r=>r.json()),fetch('/api/categories').then(r=>r.json())]);area.innerHTML='<option value="">Scegli il quartiere</option>'+ar.filter(x=>!x.slug.startsWith('municipio')&&x.slug!=='roma').map(x=>`<option value="${x.id}">${x.name}</option>`).join('');cats=cr;renderCats();}
function renderCats(){const t=type.value;const kind=t==='report'?'news':t;category.innerHTML='<option value="">Scegli la categoria</option>'+cats.filter(x=>x.kind===kind||!x.kind).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');eventFields.hidden=t!=='event';businessFields.hidden=t!=='business';for(const el of eventFields.querySelectorAll('input'))el.required=t==='event'&&['start','venue'].includes(el.name);for(const el of businessFields.querySelectorAll('input'))el.required=t==='business'&&['address','cap'].includes(el.name);}
type.onchange=renderCats;f.onsubmit=async e=>{e.preventDefault();out.textContent='Invio in corso…';const r=await fetch('/api/submission',{method:'POST',body:new FormData(f)});const j=await r.json().catch(()=>({}));out.textContent=r.ok?'Fatto. Controlla la tua email per confermare l’indirizzo.':'Non è stato possibile inviare: '+(j.error||r.status);};init().catch(()=>{out.textContent='Impossibile caricare il modulo. Riprova tra poco.'});
</script></body></html>
